<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>reel — blueprint</title>
<style>
  /* BLUEPRINT — an engineering drawing on a navy drafting sheet for a 9:16 reel.
     Footage plays full-bleed for the story beats; scenes without footage are a
     gridded sheet where white line art draws itself on, stroke by stroke, with
     cyan dimension lines and mono labels. Props come from project.json beats
     ("draw"), already timed to spoken words by build_index.py.
     Layers (CSS z-index decides paint order, not the track index):
       0 sheet background · 1 footage · 2 desaturate blend · 3 footage scrim
       4 scene layer (drawn sheet + props) · 5 frame marks · 6 header, beat text
       7 captions · 8 dips / flashes · 9 CTA
     Generated per project by pipeline/build_index.py (style "blueprint"). */
  @font-face { font-family: "Inter Tight"; font-style: normal; font-weight: 600;
    src: url("assets/style/fonts/inter-tight-latin-600-normal.woff2") format("woff2"); }
  @font-face { font-family: "Inter Tight"; font-style: normal; font-weight: 800;
    src: url("assets/style/fonts/inter-tight-latin-800-normal.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Mono"; font-style: normal; font-weight: 500;
    src: url("assets/style/fonts/ibm-plex-mono-latin-500-normal.woff2") format("woff2");
    unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
  @font-face { font-family: "IBM Plex Mono"; font-style: normal; font-weight: 500;
    src: url("assets/style/fonts/ibm-plex-mono-latin-ext-500-normal.woff2") format("woff2");
    unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
  <!--HF:FONT_FACES-->

  :root {
    --bg: #0d2a4a;
    --ink: #eaf2ff;
    --acc: #6fd3ff;
    --hot: #ff7a3d;
    --leaf: #7fe08f;
    --m: 72px;           /* left margin */
    --w: 864px;          /* content width: 72 .. 936, clear of the right 120 px UI strip */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--bg); }
  #stage {
    position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: "Inter Tight", "Noto Sans Devanagari", "Helvetica Neue", Arial, sans-serif;
  }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-weight: 500; letter-spacing: .06em; }

  /* the drafting sheet: navy, a vignette, minor and major grid */
  .sheet-bg {
    background:
      linear-gradient(rgba(170, 205, 255, .16) 2px, transparent 2px) 0 0 / 120px 120px,
      linear-gradient(90deg, rgba(170, 205, 255, .16) 2px, transparent 2px) 0 0 / 120px 120px,
      linear-gradient(rgba(170, 205, 255, .07) 1px, transparent 1px) 0 0 / 30px 30px,
      linear-gradient(90deg, rgba(170, 205, 255, .07) 1px, transparent 1px) 0 0 / 30px 30px,
      radial-gradient(1100px 1500px at 50% 42%, #14375e 0%, var(--bg) 62%, #081c33 100%);
  }
  #bg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; z-index: 0; }

  /* footage, full bleed */
  .scene { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; z-index: 1; transform-origin: 50% 45%; }
  .desat { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; z-index: 2; background: #808080; mix-blend-mode: saturation; }
  #scrim { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; z-index: 3; pointer-events: none;
    background:
      linear-gradient(180deg, rgba(4, 16, 32, .70) 0px, rgba(4, 16, 32, .22) 620px, rgba(4, 16, 32, 0) 880px),
      linear-gradient(0deg, rgba(4, 16, 32, .82) 0px, rgba(4, 16, 32, .55) 520px, rgba(4, 16, 32, 0) 880px); }

  /* one layer per scene: a drawn sheet (no footage) or a transparent overlay */
  .layer { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; z-index: 4; transform-origin: 50% 42%; }
  .art { position: absolute; left: 0; top: 0; overflow: visible; }
  .ln { fill: none; stroke: var(--ink); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
  .thin { stroke-width: 2.5; }
  .acc { stroke: var(--acc); }
  .wrn { stroke: var(--hot); }
  .grn { stroke: var(--leaf); }
  .cl { stroke: var(--acc); stroke-width: 2; stroke-dasharray: 26 10 4 10; opacity: .7; fill: none; }
  .tx { fill: var(--ink); font-family: "IBM Plex Mono", ui-monospace, monospace; font-weight: 500; letter-spacing: .06em; }
  .tx.c { fill: var(--acc); }
  .tx.big { font-family: "Inter Tight", "Helvetica Neue", Arial, sans-serif; font-weight: 800; letter-spacing: -.01em; }

  /* furniture */
  #frame { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; z-index: 5; }
  #header { position: absolute; left: var(--m); top: 228px; width: var(--w); z-index: 6; }
  #header .rule { height: 2px; background: var(--acc); transform-origin: 0 50%; opacity: .9; }
  #header .labels { margin-top: 12px; font-size: 24px; text-transform: uppercase; color: var(--ink); }
  .counter { position: absolute; left: calc(var(--m) + var(--w) - 280px); top: 242px; width: 280px; height: 32px;
    text-align: right; font-size: 24px; overflow: hidden; z-index: 6; color: var(--acc); }
  .counter span { display: inline-block; }

  /* mask reveal */
  .m { display: inline-block; overflow: hidden; vertical-align: top; padding: 0 .02em .1em; margin-bottom: -.1em; }
  .mi { display: inline-block; }
  .mi.em { color: var(--hot); }

  /* hook headline and beat text: heavy grotesk + a cyan dimension line */
  #headline, .beat-text.bp { position: absolute; left: var(--m); top: 300px; width: var(--w); z-index: 6;
    font-weight: 800; line-height: .92; letter-spacing: -.03em; text-shadow: 0 4px 24px rgba(0, 0, 0, .35); }
  .dim { position: relative; height: 26px; margin-top: 26px; width: 520px; transform-origin: 0 50%; }
  .dim::before { content: ""; position: absolute; left: 0; right: 0; top: 12px; height: 3px; background: var(--acc); }
  .dim::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 26px;
    border-left: 3px solid var(--acc); border-right: 3px solid var(--acc); }

  /* captions: flush-left, karaoke — words light up as they are spoken */
  .cap { position: absolute; left: var(--m); top: 1380px; width: var(--w); z-index: 7;
    font-weight: 800; font-size: 60px; line-height: 1.08; letter-spacing: -.015em;
    text-shadow: 0 2px 14px rgba(0, 0, 0, .55); }
  .cap .w { display: inline-block; opacity: .4; }
  .cap .w.em { color: var(--hot); }

  /* props */
  .pw { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  .polaroid { position: absolute; left: 250px; top: 470px; width: 580px; height: 700px; background: #f5f1e6;
    padding: 28px 28px 0; box-shadow: 0 30px 60px rgba(0, 0, 0, .45); transform-origin: 50% 0%; }
  .polaroid .ph { width: 524px; height: 540px; overflow: hidden; background: #1a2b3f; position: relative; }
  .polaroid .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .polaroid .ph svg { position: absolute; left: 0; top: 0; }
  .polaroid .pc { color: #1b2a40; font-size: 34px; text-align: center; margin-top: 30px; }
  .tag { position: absolute; left: 640px; top: 520px; width: 360px; height: 560px; transform-origin: 180px 0px; }
  .receipt-slot { position: absolute; left: 230px; top: 440px; width: 620px; height: 900px; overflow: hidden; }
  .receipt-slot .slot { position: absolute; left: 0; top: 0; width: 620px; height: 10px; background: var(--ink); opacity: .9; }
  .receipt { position: absolute; left: 30px; top: 10px; width: 560px; background: #f3efe4; color: #13253d;
    padding: 40px 38px 80px; clip-path: polygon(0 0, 100% 0, 100% 100%, 95% 97%, 90% 100%, 85% 97%, 80% 100%, 75% 97%, 70% 100%, 65% 97%, 60% 100%, 55% 97%, 50% 100%, 45% 97%, 40% 100%, 35% 97%, 30% 100%, 25% 97%, 20% 100%, 15% 97%, 10% 100%, 5% 97%, 0 100%); }
  .receipt .rh { font-size: 34px; text-align: center; }
  .receipt .rs { font-size: 22px; text-align: center; opacity: .7; margin-top: 8px; }
  .receipt .rr { border-top: 3px dashed #13253d; margin: 26px 0; opacity: .6; }
  .receipt .row { position: relative; display: flex; justify-content: space-between; font-size: 26px; padding: 14px 0; }
  .receipt .row span { position: relative; z-index: 1; }
  .receipt .row .hl { position: absolute; left: -12px; right: -12px; top: 4px; bottom: 4px; background: var(--hot); opacity: 0; z-index: 0; }
  .receipt .total { font-size: 34px; }
  .receipt .total .circ { position: absolute; left: -12px; top: -24px; overflow: visible; }
  .sticker { position: absolute; left: 150px; top: 820px; padding: 22px 38px 28px; background: #ffd34d; color: #10233c;
    font-weight: 800; font-size: 92px; line-height: 1; letter-spacing: -.02em; border: 7px solid #10233c; border-radius: 22px;
    box-shadow: 12px 12px 0 rgba(0, 0, 0, .45); transform-origin: 50% 50%; white-space: nowrap; }
  .stamp { position: absolute; left: 280px; top: 560px; width: 520px; height: 520px; transform-origin: 50% 50%; }
  .stamp .band { position: absolute; left: -10px; top: 214px; width: 540px; height: 92px; background: var(--bg);
    border: 6px solid var(--hot); color: var(--hot); font-size: 54px; text-align: center; line-height: 80px; }
  .rk { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  .scan { position: absolute; left: 0; top: 0; width: 1080px; height: 4px; background: var(--acc);
    box-shadow: 0 0 24px 6px rgba(111, 211, 255, .6); z-index: 4; }
  .card { position: absolute; left: 130px; width: 820px; height: 240px; }
  .card .lab { position: absolute; left: 270px; top: 56px; font-weight: 800; font-size: 100px; line-height: 1; letter-spacing: -.03em; }
  .plate { position: absolute; left: var(--m); width: var(--w); font-weight: 800; letter-spacing: -.03em; line-height: 1; }
  .plate .br { position: absolute; top: -18px; bottom: -18px; width: 34px; border: 5px solid var(--acc); }
  .plate .br.l { left: -22px; border-right: 0; }
  .plate .mi.em { color: var(--acc); }
  .row-chk { position: absolute; left: 300px; width: 640px; font-weight: 800; letter-spacing: -.02em; line-height: 1.02; opacity: .3; }
  .tile { position: absolute; left: 130px; width: 820px; height: 230px; }
  .tile .lab { position: absolute; left: 290px; top: 52px; font-weight: 800; font-size: 82px; letter-spacing: -.03em; line-height: 1; }
  .tile .per { position: absolute; left: 294px; top: 150px; font-size: 26px; color: var(--acc); }

  /* CTA: the drawing's title block, enlarged */
  #cta { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; z-index: 9; }
  #cta .tb { position: absolute; left: 100px; top: 420px; width: 880px; height: 760px; }
  #cta .lab { position: absolute; left: 150px; top: 470px; width: 780px; font-size: 32px; text-transform: uppercase; color: var(--acc); line-height: 1.3; }
  #cta .kw { position: absolute; left: 146px; top: 590px; width: 800px; font-weight: 800; font-size: 168px; line-height: .88; letter-spacing: -.045em; transform-origin: 0% 50%; }
  #cta .note { position: absolute; left: 150px; top: 960px; width: 780px; font-size: 30px; text-transform: uppercase; line-height: 1.3; }
  #cta .meta { position: absolute; left: 150px; top: 1110px; width: 780px; font-size: 20px; text-transform: uppercase; color: var(--acc); display: flex; justify-content: space-between; }
</style>
</head>
<body>
<div id="stage" data-composition-id="reel" data-start="0" data-width="1080" data-height="1920" data-fps="30" data-duration="<!--HF:DURATION-->">

  <!-- track 1: scene media and word-anchored inserts (generated) -->
  <!--HF:SLIDES-->

  <!-- tracks 4-6: voice / music / sfx (generated) -->
  <!--HF:AUDIO-->

  <script type="application/json" id="hf-data"><!--HF:DATA--></script>
  <script src="assets/gsap.min.js"></script>
  <script src="assets/style/reel.js"></script>
  <script src="assets/style/props.js"></script>
  <script>
  (function () {
    const R = window.REEL, D = R.D, P = R.params, esc = R.esc;
    const stage = R.stage;
    for (const k of ["bg", "ink", "acc", "hot", "leaf"]) if (P[k]) stage.style.setProperty("--" + k, P[k]);
    const tl = gsap.timeline({ paused: true });
    const IN = "expo.out";
    const n = R.scenes.length;

    const { PROPS, H } = REEL_PROPS(tl);
    const { svg, DR, drawOn, fadeIn, maskIn, words, stacked, sizeFor, reps } = H;

    /* ---------- furniture ---------- */
    R.clip({ id: "bg", cls: "sheet-bg", start: 0, dur: R.total, track: 0 });
    R.clip({ id: "scrim", start: 0, dur: R.total, track: 2 });
    R.clip({ id: "frame", start: 0, dur: R.total, track: 2, html: svg(
      [[48, 196, 1, 1], [1032, 196, -1, 1], [48, 1724, 1, -1], [1032, 1724, -1, -1]].map(([x, y, sx, sy]) =>
        `<path class="ln thin acc d" ${DR} d="M${x} ${y + sy * 54} L ${x} ${y} L ${x + sx * 54} ${y}"/>`).join("")) });
    drawOn(document.querySelectorAll("#frame .d"), 0, 0.6, 0.05);
    R.clip({ id: "header", start: 0, dur: R.total, track: 2, html:
      `<div class="rule"></div><div class="labels mono">${esc(P.file_label || D.kicker)}</div>` });
    tl.fromTo("#header .rule", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: IN }, 0);
    tl.fromTo("#header .labels", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: IN }, 0.1);

    /* ---------- scenes ---------- */
    R.scenes.forEach((s, i) => {
      const end = R.sceneEnd(s);
      const b = R.beat(s);
      const media = R.mediaFor(s);
      const drawn = !s.media_id;                 // no footage on screen: a drafting sheet
      const next = R.scenes[i + 1];
      // a drawn sheet runs into the next scene only when that one is a sheet too
      // (so push / dissolve slide over it); footage must never sit under a stale sheet
      const overlap = next && !next.media_id ? 0.5 : 0;
      const props = b.draw || [];
      let layer = null;
      if (drawn || props.length || s === R.last) {
        layer = R.clip({ cls: "layer" + (drawn ? " sheet-bg" : ""), start: s.start, dur: s.duration + overlap, track: 2 });
      }

      // the cut into the scene, then the hold move
      R.cutIn(tl, s, {
        targets: media.length ? media : (drawn && layer ? [layer] : []),
        drift: media.length ? [1.07, 1.0] : [1, 1],
      });

      // sheet counter
      const c = R.clip({ cls: "counter mono", start: s.start, dur: s.duration, track: 2,
        html: `<span>${esc(P.sheet_label || "SHEET")} ${R.pad2(i + 1)} / ${R.pad2(n)}</span>` });
      if (R.hasCut(s)) tl.fromTo(c.firstChild, { yPercent: 110 }, { yPercent: 0, duration: 0.45, ease: IN }, s.start);

      props.forEach((sp) => {
        const fn = PROPS[sp.prop];
        if (!fn) { console.warn("blueprint: unknown prop", sp.prop); return; }
        fn(sp, s, layer);
      });

      // captions: every word lights up on its spoken time
      R.captionsFor(s).forEach((cap) => {
        const html = cap.words.map((w) => `<span class="w${R.isEmphasis(w.text) ? " em" : ""}">${esc(w.text)}</span>`).join(" ");
        const el = R.clip({ cls: "cap", start: cap.start, dur: cap.end - cap.start, track: 3, html });
        tl.fromTo(el, { y: 14 }, { y: 0, duration: 0.25, ease: IN }, cap.start);
        el.querySelectorAll(".w").forEach((sp, j) => {
          const w = cap.words[j];
          tl.fromTo(sp, { opacity: 0.4 }, { opacity: 1, duration: 0.12, ease: "none" }, Math.max(cap.start, w.start - 0.03));
        });
      });

      if (i === 0) {
        // hook: on screen by 0.2 s, rising through its mask; dimension line under it
        const h = R.clip({ id: "headline", start: 0, dur: end, track: 2, html:
          `<div style="font-size:${sizeFor(D.title, true)}px">${stacked(D.title, sizeFor(D.title, true))}</div><div class="dim"></div>` });
        tl.fromTo("#headline .mi", { yPercent: 105 }, { yPercent: 0, duration: 0.5, ease: IN, stagger: 0.04 }, 0.02);
        tl.fromTo("#headline .dim", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: IN }, 0.3);
        // the smash cut lights the first word
        const ins = (b.inserts || [])[0];
        const first = h.querySelector(".mi");
        if (ins && first) tl.set(first, { color: P.hot || "#ff7a3d" }, ins.start);
        R.fadeOutAt(tl, h, end, 0.25);
      }

      if (s === R.last && layer) {
        // CTA: the title block of the drawing, enlarged
        const cta = R.clip({ id: "cta", start: s.start, dur: end - s.start, track: 2, html:
          svg(`<rect class="ln d" ${DR} x="100" y="420" width="880" height="760"/>
               <line class="ln thin d" ${DR} x1="100" y1="560" x2="980" y2="560"/>
               <line class="ln thin d" ${DR} x1="100" y1="930" x2="980" y2="930"/>
               <line class="ln thin d" ${DR} x1="100" y1="1080" x2="980" y2="1080"/>
               <path class="ln acc arrow d" ${DR} style="stroke-width:8" d="M230 1196 C 230 1260, 205 1310, 160 1346"/>
               <path class="ln acc arrow d" ${DR} style="stroke-width:8" d="M152 1292 L 156 1350 L 212 1340"/>`) +
          `<div class="lab mono">${esc(P.cta_label || "Follow for more")}</div>
           <div class="kw">${words(D.cta_keyword)}</div>
           <div class="note mono">${esc(P.cta_note || "")}</div>
           <div class="meta mono"><span>${esc(P.file_label || D.kicker)}</span><span>${esc(P.sheet_label || "SHEET")} ${R.pad2(n)} / ${R.pad2(n)}</span></div>` });
        const t0 = s.start + (s.pause_before || 0) + 0.15;
        drawOn(cta.querySelectorAll(".d:not(.arrow)"), t0, 0.7, 0.08);
        fadeIn(cta.querySelectorAll(".lab"), t0 + 0.3, 0.3);
        maskIn(cta, t0 + 0.45, 0.06);
        fadeIn(cta.querySelectorAll(".note, .meta"), t0 + 0.9, 0.3, 0.1);
        drawOn(cta.querySelectorAll(".arrow"), t0 + 1.2, 0.5, 0.25, "power2.out");
        const kw = cta.querySelector(".kw");
        tl.to(kw, { scale: 1.035, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: reps(end - t0 - 2.0, 0.5) }, t0 + 2.0);
      }
    });

    // a line's on-screen text (project.json beats): heavy type over a dimension line
    R.beatTexts(tl, { cls: "bp", mode: "mask", delay: 0.1, wrap: (h, s) =>
      `<div style="font-size:${sizeFor(s.beat.text)}px">${stacked(s.beat.text, sizeFor(s.beat.text))}</div><div class="dim"></div>`,
      enter: (tl, el, t) => {
        maskIn(el, t);
        tl.fromTo(el.querySelector(".dim"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: IN }, t + 0.2);
      } });
    R.insertCuts(tl, { flash: 0.1 });   // the smash cut on the word gets a white burst

    window.__timelines = window.__timelines || {};
    window.__timelines.reel = tl;
  })();
  </script>
</div>
</body>
</html>
