<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>reel — neo brutal</title>
<style>
  /* NEO BRUTAL — neubrutalism / collage: flat paper with a dot grid, footage
     in thick-bordered cards with zero-blur offset shadows, saturated flat
     colour blocks, a quirky heavy grotesk with a mono for tags, sticker
     labels, marker-highlight captions, cards pushed in and out like cut-outs,
     stepped stop-motion wiggles. Generated by pipeline/build_index.py
     (style "neo-brutal"). */
  @font-face { font-family: "Bricolage Grotesque"; font-style: normal; font-weight: 800;
    src: url("assets/style/fonts/bricolage-grotesque-latin-800-normal.woff2") format("woff2");
    unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
  @font-face { font-family: "Bricolage Grotesque"; font-style: normal; font-weight: 800;
    src: url("assets/style/fonts/bricolage-grotesque-latin-ext-800-normal.woff2") format("woff2");
    unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
  @font-face { font-family: "Space Mono"; font-style: normal; font-weight: 700;
    src: url("assets/style/fonts/space-mono-latin-700-normal.woff2") format("woff2");
    unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
  @font-face { font-family: "Space Mono"; font-style: normal; font-weight: 700;
    src: url("assets/style/fonts/space-mono-latin-ext-700-normal.woff2") format("woff2");
    unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
  <!--HF:FONT_FACES-->

  :root {
    --paper: #f4efe3;
    --ink: #111111;
    --yellow: #ffd60a;
    --pink: #ff6fb5;
    --blue: #4d7cff;
    --lime: #b8f53a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--paper); }
  #stage {
    position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); color: var(--ink);
    font-family: "Bricolage Grotesque", "Noto Sans Devanagari", "Arial Black", sans-serif; font-weight: 800;
  }
  .mono { font-family: "Space Mono", ui-monospace, monospace; font-weight: 700; }

  #paper { position: absolute; inset: 0; z-index: 0;
    background-color: var(--paper);
    background-image: radial-gradient(circle, rgba(17,17,17,.16) 2.2px, rgba(0,0,0,0) 2.6px);
    background-size: 30px 30px; background-position: 15px 15px; }

  /* the card: media + a backing frame that carries border and hard shadow */
  .scene { position: absolute; left: 100px; top: 372px; width: 840px; height: 940px; object-fit: cover; z-index: 3;
    border-radius: 10px; transform-origin: 50% 50%; }
  .frame { position: absolute; left: 92px; top: 364px; width: 856px; height: 956px; z-index: 2;
    background: var(--ink); border-radius: 16px; box-shadow: 20px 20px 0 var(--ink); transform-origin: 50% 50%; }

  .blob { position: absolute; z-index: 1; border: 7px solid var(--ink); }
  #circle { left: 720px; top: 1130px; width: 250px; height: 250px; border-radius: 50%; background: var(--blue); }
  #star { position: absolute; left: 34px; top: 1186px; width: 190px; height: 190px; z-index: 4; overflow: visible; }

  /* hook */
  #hook { position: absolute; left: 60px; width: 900px; top: 236px; z-index: 6; }
  #hook .tag { display: inline-block; background: var(--ink); color: var(--paper); font-size: 28px; padding: 8px 16px; transform: rotate(-2deg); }
  #hook .head { display: inline-block; margin-top: 14px; background: var(--yellow); border: 7px solid var(--ink); box-shadow: 14px 14px 0 var(--ink);
    padding: 14px 26px 20px; line-height: .95; letter-spacing: -.03em; border-radius: 12px; }
  #hook .head .em { background: var(--pink); padding: 0 .08em; border-radius: 8px; }

  .badge { position: absolute; left: 812px; top: 300px; width: 138px; height: 138px; z-index: 6; border-radius: 50%;
    background: var(--pink); border: 7px solid var(--ink); box-shadow: 8px 8px 0 var(--ink);
    display: flex; align-items: center; justify-content: center; font-size: 46px; }
  .badge.c2 { background: var(--lime); } .badge.c3 { background: var(--blue); color: #fff; } .badge.c4 { background: var(--yellow); }

  /* captions: boxed, the spoken word gets a marker swipe */
  .cap { position: absolute; left: 72px; width: 870px; top: 1380px; z-index: 7; }
  .cap .box { display: inline-block; background: #fff; border: 6px solid var(--ink); box-shadow: 10px 10px 0 var(--ink); border-radius: 10px;
    padding: 12px 22px 16px; font-size: 56px; line-height: 1.12; letter-spacing: -.015em; transform-origin: 0 50%; }
  .cap .w { position: relative; display: inline-block; isolation: isolate; }
  .cap .hl { position: absolute; left: -.08em; right: -.08em; top: .14em; bottom: .02em; z-index: -1; background: var(--yellow);
    border-radius: 6px; transform-origin: 0 50%; }
  .cap .hl.em { background: var(--pink); }

  /* CTA */
  #cta { position: absolute; left: 60px; width: 900px; top: 560px; z-index: 8; text-align: center; }
  #cta .lab { display: inline-block; background: var(--ink); color: var(--paper); font-size: 40px; padding: 12px 24px; transform: rotate(3deg); }
  #cta .kw { display: inline-block; margin-top: 18px; background: var(--pink); border: 9px solid var(--ink); box-shadow: 20px 20px 0 var(--ink);
    padding: 10px 44px 26px; border-radius: 18px; font-size: 200px; line-height: .95; letter-spacing: -.04em; }
  #cta .note { display: inline-block; margin-top: 34px; background: var(--lime); border: 6px solid var(--ink); font-size: 30px; padding: 10px 20px; transform: rotate(-2deg); }
</style>
</head>
<body>
<div id="stage" data-composition-id="reel" data-start="0" data-width="1080" data-height="1920" data-fps="30" data-duration="<!--HF:DURATION-->">

  <!--HF:SLIDES-->

  <!--HF:AUDIO-->

  <script type="application/json" id="hf-data"><!--HF:DATA--></script>
  <script src="assets/gsap.min.js"></script>
  <script src="assets/style/reel.js"></script>
  <script>
  (function () {
    const R = window.REEL, D = R.D, P = R.params;
    for (const k of ["paper", "yellow", "pink", "blue", "lime"]) if (P[k]) R.stage.style.setProperty("--" + k, P[k]);
    const tl = gsap.timeline({ paused: true });
    const TILT = [-2.2, 1.6, -1.2, 2.0, -1.8, 1.2];
    const PUSH = P.push || 0.45;   // matches style.json scene_overlap

    R.clip({ id: "paper", start: 0, dur: R.total, track: 0 });
    const circle = R.clip({ id: "circle", cls: "blob", start: 0, dur: R.total, track: 0 });
    R.clip({ start: 0, dur: R.total, track: 2, html:
      `<svg id="star" viewBox="-100 -100 200 200"><path d="M0,-92 L22,-30 L88,-28 L36,12 L54,76 L0,40 L-54,76 L-36,12 L-88,-28 L-22,-30 Z"
        style="fill: var(--lime)" stroke="#111" stroke-width="8" stroke-linejoin="round"/></svg>` });
    // ambient motion: nothing on the page is ever fully still
    tl.fromTo("#star", { rotation: 0 }, { rotation: 30 * R.total, duration: R.total, ease: "none" }, 0);
    tl.fromTo(circle, { y: 0 }, { y: -40, duration: R.total, ease: "sine.inOut" }, 0);

    R.scenes.forEach((s, i) => {
      const end = R.sceneEnd(s);
      const media = document.getElementById(s.id);
      const tilt = TILT[i % TILT.length];
      const frame = R.clip({ cls: "frame", start: s.start, dur: s.duration + (s === R.last ? 0 : PUSH), track: 1 });
      const card = [media, frame];

      // in: pushed on from the right like a cut-out, overshooting into its tilt
      if (i === 0) {
        tl.fromTo(card, { y: 900, rotation: 8 }, { y: 0, rotation: tilt, duration: 0.55, ease: "back.out(1.5)" }, 0);
      } else {
        tl.fromTo(card, { x: 1150, rotation: tilt + 9 }, { x: 0, rotation: tilt, duration: 0.5, ease: "back.out(1.3)" }, s.start);
      }
      // hold: a slow push inside the card
      tl.fromTo(media, { scale: 1.0 }, { scale: 1.06, duration: s.duration, ease: "none", immediateRender: false }, s.start + 0.3);
      // out: flung off to the left as the next card arrives
      if (s !== R.last) {
        tl.to(card, { x: -1250, rotation: tilt - 12, duration: 0.45, ease: "power3.in" }, end - 0.05);
      }

      // scene badge for the middle beats (the hook and CTA carry their own stickers)
      if (i > 0 && s !== R.last) {
        const b = R.clip({ cls: "badge mono c" + (i % 4 + 1), start: s.start, dur: s.duration, track: 2, text: R.pad2(i + 1) });
        tl.fromTo(b, { scale: 0, rotation: -30 }, { scale: 1, rotation: 8, duration: 0.35, ease: "back.out(2.2)" }, s.start + 0.25);
        const span = end - (s.start + 0.8);
        if (span >= 0.6) tl.to(b, { rotation: -8, duration: 0.3, ease: "steps(1)", yoyo: true, repeat: Math.max(0, Math.floor(span / 0.3) - 1) }, s.start + 0.8);
      }

      // captions with a marker swipe on the live word
      R.captionsFor(s).forEach((cap) => {
        const html = `<span class="box">` + cap.words.map((w) =>
          `<span class="w"><span class="hl${R.isEmphasis(w.text) ? " em" : ""}"></span>${R.esc(w.text)}</span>`).join(" ") + `</span>`;
        const el = R.clip({ cls: "cap", start: cap.start, dur: cap.end - cap.start, track: 3, html });
        tl.fromTo(el.querySelector(".box"), { scale: 0.92, rotation: -1.5 }, { scale: 1, rotation: 0, duration: 0.2, ease: "back.out(2)" }, cap.start);
        el.querySelectorAll(".hl").forEach((hl, j) => {
          const w = cap.words[j];
          const next = j + 1 < cap.words.length ? cap.words[j + 1].start : cap.end;
          tl.fromTo(hl, { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.14, ease: "power2.out" }, w.start);
          if (!R.isEmphasis(w.text)) tl.to(hl, { scaleX: 0, transformOrigin: "100% 50%", duration: 0.1, ease: "power1.in" }, Math.max(w.start + 0.14, next - 0.02));
        });
      });

      if (i === 0) {
        const len = D.title.length;
        const size = len <= 16 ? 112 : len <= 28 ? 92 : 74;
        const head = R.esc(D.title).split(" ").map((w) => R.isEmphasis(w) ? `<span class="em">${w}</span>` : w).join(" ");
        const h = R.clip({ id: "hook", start: 0, dur: end, track: 2, html:
          `<div class="tag mono">[${R.esc(D.kicker)}]</div><br><div class="head" style="font-size:${size}px">${head}</div>` });
        tl.fromTo("#hook .head", { y: -260, rotation: -9 }, { y: 0, rotation: -3, duration: 0.5, ease: "back.out(1.7)" }, 0);
        tl.fromTo("#hook .tag", { scale: 0 }, { scale: 1, duration: 0.25, ease: "back.out(2.5)" }, 0.15);
        tl.to("#hook .head", { rotation: -1, duration: 0.25, ease: "steps(1)", yoyo: true, repeat: Math.max(0, Math.floor((end - 1.2) / 0.25) - 1) }, 0.9);
        tl.to(h, { y: -420, rotation: -8, duration: 0.35, ease: "power3.in" }, Math.max(0.8, end - 0.35));
        tl.set(h, { opacity: 0 }, end);
      }

      if (s === R.last) {
        R.clip({ id: "cta", start: s.start, dur: end - s.start, track: 2, html:
          `<div class="lab mono">${R.esc(P.cta_label || "comment ↓")}</div><br><div class="kw">${R.esc(D.cta_keyword)}</div><br>
           <div class="note mono">${R.esc(P.cta_note || "I'll DM you the template")}</div>` });
        tl.fromTo("#cta .kw", { scale: 0.2, rotation: -20 }, { scale: 1, rotation: 4, duration: 0.5, ease: "back.out(1.8)" }, s.start + 0.35);
        tl.fromTo("#cta .lab", { y: -200 }, { y: 0, duration: 0.4, ease: "back.out(2)" }, s.start + 0.2);
        tl.fromTo("#cta .note", { x: -900 }, { x: 0, duration: 0.45, ease: "back.out(1.4)" }, s.start + 0.6);
        const span = end - (s.start + 1.1);
        if (span >= 0.5) tl.to("#cta .kw", { rotation: -3, duration: 0.25, ease: "steps(1)", yoyo: true, repeat: Math.max(0, Math.floor(span / 0.25) - 1) }, s.start + 1.1);
      }
    });

    window.__timelines = window.__timelines || {};
    window.__timelines.reel = tl;
  })();
  </script>
</div>
</body>
</html>
