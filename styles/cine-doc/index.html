  /* CINE DOC — cinematic documentary: letterbox matte, tracking-in serif
     title, chapter cards in roman numerals, cross-dissolves, Ken Burns drift,
     cinema subtitles, a dip to black into an end-title CTA. The bars sit over
     the phone's UI zones (top 220 / bottom 420), so the matte costs no picture
     anyone could see. Grade: teal & orange with grain and vignette, baked in by
     pipeline/footage.py. Generated by pipeline/build_index.py (style "cine-doc"). */

  <!--HF:FONT_FACES-->

  :root {
    --bar-top: 300px;
    --bar-bottom: 420px;
    --warm: #f3e6d0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #000; }
  #stage {
    position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; color: #fff;
    font-family: "Instrument Sans", "Noto Sans Devanagari", "Helvetica Neue", Arial, sans-serif;
  }
  .serif { font-family: "Instrument Serif", "Noto Sans Devanagari", Georgia, serif; font-weight: 400; }

  .scene { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; z-index: 1; transform-origin: 50% 47%; }
  #vignette { position: absolute; inset: 0; z-index: 2;
    background: radial-gradient(120% 70% at 50% 47%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%); }
  .dip { position: absolute; inset: 0; background: #000; z-index: 3; }

  /* letterbox matte */
  .bar { position: absolute; left: 0; width: 1080px; background: #000; z-index: 6; }
  #bar-top { top: 0; height: var(--bar-top); transform-origin: 50% 0; }
  #bar-bottom { bottom: 0; height: var(--bar-bottom); transform-origin: 50% 100%; }
  #slug { position: absolute; left: 72px; width: 864px; top: 244px; z-index: 7; display: flex; justify-content: space-between;
    font-size: 22px; font-weight: 600; letter-spacing: .32em; text-transform: uppercase; color: rgba(255,255,255,.62); }

  /* title */
  #title { position: absolute; left: 72px; width: 864px; top: 380px; z-index: 5; text-align: center; }
  #title .kick { font-size: 24px; font-weight: 600; letter-spacing: .42em; text-transform: uppercase; color: var(--warm); }
  #title .rule { width: 90px; height: 1px; background: var(--warm); margin: 26px auto 22px; transform-origin: 50% 50%; }
  #title .t { line-height: .98; text-shadow: 0 4px 30px rgba(0,0,0,.6); }
  #title .t .em { font-style: italic; color: var(--warm); }
  .wd { display: inline-block; white-space: nowrap; }
  .ch { display: inline-block; }

  /* chapter card */
  .chapter { position: absolute; left: 72px; top: 352px; z-index: 5; display: flex; align-items: center; gap: 22px; }
  .chapter .num { font-size: 92px; font-style: italic; line-height: 1; color: var(--warm); text-shadow: 0 2px 20px rgba(0,0,0,.5); }
  .chapter .line { width: 70px; height: 1px; background: rgba(255,255,255,.8); transform-origin: 0 50%; }
  .chapter .lab { font-size: 22px; font-weight: 600; letter-spacing: .34em; text-transform: uppercase; }

  /* cinema subtitles: sentence case, no box, inside the picture */
  .sub { position: absolute; left: 110px; width: 860px; top: 1384px; z-index: 5; text-align: center;
    font-size: 44px; font-weight: 500; line-height: 1.22; letter-spacing: .005em;
    text-shadow: 0 2px 3px rgba(0,0,0,.9), 0 0 18px rgba(0,0,0,.6); }

  /* end title */
  #endcard { position: absolute; left: 72px; width: 864px; top: 560px; z-index: 5; text-align: center; }
  #endcard .pre { font-size: 64px; font-style: italic; color: var(--warm); }
  #endcard .kw { font-size: 210px; line-height: .9; letter-spacing: .04em; margin: 12px 0 6px; text-shadow: 0 6px 40px rgba(0,0,0,.6); }
  #endcard .r { width: 520px; height: 1px; background: rgba(255,255,255,.7); margin: 22px auto; transform-origin: 50% 50%; }
  #endcard .note { font-size: 24px; font-weight: 600; letter-spacing: .36em; text-transform: uppercase; color: rgba(255,255,255,.8); }
  #endshade { position: absolute; inset: 0; z-index: 4; background: rgba(0,0,0,.42); }
</style>
</head>
<body>
<div id="stage" data-composition-id="reel" data-start="0" data-width="1080" data-height="1920" data-fps="30" data-duration="<!--HF:DURATION-->">

  <!--HF:SLIDES-->

  <!--HF:AUDIO-->

  <script type="application/json" id="hf-data"><!--HF:DATA--></script>
  <script src="assets/gsap.min.js"></script>
  <script src="assets/style/reel.js"></script>
  <script>
  (function () {
    const R = window.REEL, D = R.D, P = R.params;
    const tl = gsap.timeline({ paused: true });
    const XF = P.dissolve || 0.6;
    const ROMAN = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII"];

    R.clip({ id: "vignette", start: 0, dur: R.total, track: 2 });
    R.clip({ id: "bar-top", cls: "bar", start: 0, dur: R.total, track: 2 });
    R.clip({ id: "bar-bottom", cls: "bar", start: 0, dur: R.total, track: 2 });
    R.clip({ id: "slug", start: 0, dur: R.total, track: 2,
      html: `<span>${R.esc(P.slug || D.kicker)}</span><span>${R.esc(P.slug_right || "")}</span>` });
    // the matte closes in from the frame edges over the first beat
    tl.fromTo("#bar-top, #bar-bottom", { scaleY: 0 }, { scaleY: 1, duration: 1.1, ease: "power3.inOut" }, 0);
    tl.fromTo("#slug", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "none" }, 0.6);

    R.scenes.forEach((s, i) => {
      const end = R.sceneEnd(s);
      const media = "#" + s.id;
      // Ken Burns drift: alternate push-in and pull-out, a little lateral travel
      const push = i % 2 === 0;
      tl.fromTo(media, { scale: push ? 1.0 : 1.08, x: push ? -14 : 14 },
        { scale: push ? 1.08 : 1.0, x: push ? 14 : -14, duration: s.duration + XF, ease: "sine.inOut" }, s.start);

      if (i > 0 && s !== R.last) {
        // cross-dissolve: the previous clip runs XF past its scene (scene_overlap)
        tl.fromTo(media, { opacity: 0 }, { opacity: 1, duration: XF, ease: "sine.inOut" }, s.start);
      }
      if (s === R.last && i > 0) {
        // dip to black into the end title
        const d = R.clip({ cls: "dip", start: s.start - 0.45, dur: 1.0, track: 2 });
        tl.fromTo(d, { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power1.in" }, s.start - 0.45);
        tl.to(d, { opacity: 0, duration: 0.55, ease: "power1.out" }, s.start);
        tl.set(d, { opacity: 0 }, s.start + 0.55);
      }

      if (i === 0) {
        const html = R.charSpans(D.title, R.isEmphasis);
        const len = D.title.length;
        const size = len <= 18 ? 132 : len <= 32 ? 108 : 88;
        const t = R.clip({ id: "title", start: 0, dur: end, track: 2, html:
          `<div class="kick">${R.charSpans(D.kicker)}</div><div class="rule"></div><div class="t serif" style="font-size:${size}px">${html}</div>` });
        // tracking in: letters slide together as the title resolves (transforms
        // only — a letter-spacing tween would snap to whole pixels)
        const tch = t.querySelectorAll(".t .ch"), kch = t.querySelectorAll(".kick .ch");
        tl.fromTo(tch, { opacity: 0, x: R.trackOffsets(tch, size * 0.09) },
          { opacity: 1, x: 0, duration: 2.4, ease: "power3.out", stagger: { each: 0.012, from: "center" } }, 0.05);
        tl.fromTo(kch, { opacity: 0, x: R.trackOffsets(kch, 9) }, { opacity: 1, x: 0, duration: 1.6, ease: "power2.out" }, 0);
        tl.fromTo("#title .rule", { scaleX: 0 }, { scaleX: 1, duration: 1.2, ease: "power2.inOut" }, 0.4);
        R.fadeOutAt(tl, t, end, 0.5, "sine.in");
      } else if (s !== R.last) {
        const label = (P.labels || [])[i] || "";
        const ch = R.clip({ cls: "chapter", start: s.start, dur: s.duration, track: 2, html:
          `<span class="num serif">${ROMAN[i] || i + 1}</span>` +
          (label ? `<span class="line"></span><span class="lab">${R.esc(label)}</span>` : "") });
        tl.fromTo(ch.querySelector(".num"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.9, ease: "power2.out" }, s.start + 0.25);
        if (label) {
          tl.fromTo(ch.querySelector(".line"), { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power2.inOut" }, s.start + 0.45);
          tl.fromTo(ch.querySelector(".lab"), { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.8, ease: "power2.out" }, s.start + 0.6);
        }
        R.fadeOutAt(tl, ch, end, 0.4, "sine.in");
      } else {
        const ec = R.clip({ id: "endshade", start: s.start, dur: end - s.start, track: 2 });
        tl.fromTo(ec, { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "none" }, s.start);
        R.clip({ id: "endcard", start: s.start, dur: end - s.start, track: 2, html:
          `<div class="pre serif">${R.esc(P.cta_label || "Comment the word")}</div><div class="r"></div>
           <div class="kw serif">${R.charSpans(D.cta_keyword)}</div><div class="r"></div>
           <div class="note">${R.esc(P.cta_note || "and I'll send it to you")}</div>` });
        tl.fromTo("#endcard .pre", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.9, ease: "power2.out" }, s.start + 0.35);
        tl.fromTo("#endcard .r", { scaleX: 0 }, { scaleX: 1, duration: 1.0, ease: "power2.inOut", stagger: 0.15 }, s.start + 0.5);
        const kw = document.querySelectorAll("#endcard .kw .ch");
        tl.fromTo(kw, { opacity: 0, x: R.trackOffsets(kw, 46) }, { opacity: 1, x: 0, duration: 1.6, ease: "power3.out" }, s.start + 0.55);
        tl.fromTo("#endcard .note", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "none" }, s.start + 1.2);
      }

      // subtitles: caption groups merged into sentence-length lines, cut hard
      // like cinema subtitles (no fades), held through short gaps
      const caps = R.captionsFor(s);
      const subs = [];
      caps.forEach((c) => {
        const cur = subs[subs.length - 1];
        if (cur && (cur.text + " " + c.text).length <= (P.subtitle_chars || 42) && !/[.!?]$/.test(cur.text)) {
          cur.text += " " + c.text;
          cur.end = c.end;
        } else {
          subs.push({ text: c.text, start: c.start, end: c.end });
        }
      });
      subs.forEach((sb, k) => {
        const next = subs[k + 1];
        const until = next ? Math.min(next.start, sb.end + 0.4) : Math.min(end, sb.end + 0.4);
        R.clip({ cls: "sub", start: sb.start, dur: until - sb.start, track: 3, text: sb.text });
      });
    });

    window.__timelines = window.__timelines || {};
    window.__timelines.reel = tl;
  })();
  </script>
</div>
</body>
