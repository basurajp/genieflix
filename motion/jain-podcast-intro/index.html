<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JAIN Podcast Intro</title>
    <style>
      :root {
        --bg: #0b0b0b;
        --panel: #151515;
        --line: #2a2a2a;
        --text: #e9e9e9;
        --muted: #8a8a8a;
        --accent: #00dac4;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 500 14px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; }
      main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; }
      .frame { width: min(100%, calc((100vh - 120px) * 16 / 9)); aspect-ratio: 16 / 9; background: #000; position: relative; }
      canvas { width: 100%; height: 100%; display: block; }
      #status { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); pointer-events: none; }
      #status:empty { display: none; }
      .controls { width: min(100%, calc((100vh - 120px) * 16 / 9)); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; font: inherit; cursor: pointer; }
      button:hover:not(:disabled) { border-color: var(--accent); }
      button:disabled, input:disabled { opacity: 0.4; cursor: default; }
      input[type='range'] { flex: 1; min-width: 160px; accent-color: var(--accent); }
      #clock { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 64px; text-align: right; }
      .note { color: var(--muted); font-size: 12px; width: min(100%, calc((100vh - 120px) * 16 / 9)); }
      .note a { color: var(--muted); }
    </style>
    <script type="importmap">
      { "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
    </script>
  </head>
  <body>
    <main>
      <div class="frame">
        <canvas id="stage" width="1920" height="1080"></canvas>
        <div id="status">Loading…</div>
      </div>
      <div class="controls">
        <button id="play" disabled>Play</button>
        <button id="replay" disabled>Replay</button>
        <button id="sound" disabled aria-pressed="true">Sound: on</button>
        <input id="scrub" type="range" min="0" max="1000" value="0" disabled aria-label="Scrub" />
        <span id="clock">00.00 s</span>
      </div>
      <p class="note">Real-time preview (no motion blur). <a href="?q=half">Half-resolution preview</a> for slower GPUs. The exported MP4 is rendered frame-by-frame with motion blur.</p>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
