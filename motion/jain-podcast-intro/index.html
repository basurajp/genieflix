<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JAIN Podcast Intro</title>
<style>
  @font-face { font-family: 'Inter'; font-weight: 500; src: url('assets/fonts/Inter-Medium.ttf') format('truetype'); font-display: block; }
  :root { --cyan: #00DAC4; --bg: #0b0b0b; --panel: #161616; --line: #2a2a2a; --text: #f2f2f2; --muted: #9a9a9a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; font-weight: 500; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; }
  .stage { width: min(100%, calc((100vh - 120px) * 16 / 9)); aspect-ratio: 16 / 9; background: #000; position: relative; }
  .stage canvas { width: 100%; height: 100%; display: block; }
  .loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 14px; }
  .controls { width: min(100%, calc((100vh - 120px) * 16 / 9)); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  button { font: inherit; font-size: 14px; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; cursor: pointer; }
  button:hover { border-color: var(--cyan); }
  button[aria-pressed="true"] { border-color: var(--cyan); color: var(--cyan); }
  input[type=range] { flex: 1; min-width: 160px; accent-color: var(--cyan); }
  .time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; min-width: 92px; text-align: right; }
</style>
</head>
<body>
  <div class="stage"><canvas id="c"></canvas><div class="loading" id="loading">Loading font, geometry and score…</div></div>
  <div class="controls">
    <button id="play" disabled>Play</button>
    <button id="replay" disabled>Replay</button>
    <button id="sound" aria-pressed="true" disabled>Sound on</button>
    <input id="scrub" type="range" min="0" max="12" step="0.001" value="0" disabled>
    <span class="time" id="time">0.00 / 12.00</span>
  </div>
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.js" } }</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
